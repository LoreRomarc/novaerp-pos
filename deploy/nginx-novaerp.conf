# Copiar a /etc/nginx/sites-available/novaerp y reemplazar erp.tudominio.com.
# Certbot añadirá después las líneas HTTPS automáticamente.
server {
    listen 80;
    server_name erp.tudominio.com;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/novaerp-pos/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/novaerp/novaerp.sock;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

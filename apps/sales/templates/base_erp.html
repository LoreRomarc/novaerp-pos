<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NovaERP</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f9;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 15px;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        input, select {
            padding: 6px;
            margin: 5px 0;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>

<header>
    <h2>NovaERP - Inventario</h2>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>

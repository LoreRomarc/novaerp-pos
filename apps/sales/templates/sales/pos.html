<!--apps/sales/templates/sales/pos.html-->
{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
  .pos-wrapper {
    height: calc(100vh - 50px);
  }

  /* SOLO POS, NO GLOBAL */
  .pos-left,
  .pos-right {
    font-size: 14px;
  }

  .pos-wrapper {
    display: grid;
    grid-template-columns: 1fr 380px;
    height: 100vh;
  }

  .pos-left {
    padding: 25px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== TIPO VENTA ===== */
  .tipo-venta-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .tipo-btn {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .tipo-btn.activo {
    background: #198754;
    color: white;
    border-color: #198754;
  }

  .tipo-btn:hover {
    transform: translateY(-1px);
  }

  .search-row {
    display: grid;
    grid-template-columns: 1fr 100px 110px;
    gap: 10px;
    margin-bottom: 15px;
    position: relative;
  }

  #sugerencias {
    position: absolute;
    top: 45px;
    left: 0;
    width: calc(100% - 210px);
    background: white;
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 9999;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  }

  .table-area {
    flex: 1;
    overflow-y: auto;
  }

  .pos-right {
    background: white;
    border-left: 1px solid #eaeaea;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 15px;
  }

  .keypad button {
    height: 42px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fafafa;
    font-weight: 600;
  }

  .keypad button:active {
    background: #eaeaea;
  }

  .total-final {
    font-size: 20px;
    font-weight: 700;
  }

  .pos-tabs{

    display:flex;

    align-items:center;

    gap:8px;

    padding:8px 15px;

    border-bottom:1px solid #ddd;

    background:white;

}

.tabs-container{

    display:flex;

    gap:6px;

    overflow-x:auto;

}

.tab-venta{

    display:flex;

    align-items:center;

    gap:8px;

    padding:8px 15px;

    background:#efefef;

    border-radius:10px 10px 0 0;

    cursor:pointer;

    white-space:nowrap;

}

.tab-venta.active{

    background:#0d6efd;

    color:white;

}

.tab-venta .cerrar{

    cursor:pointer;

    font-weight:bold;

} 
</style>

<script type="module">
import { parseMoney, formatMoney } from "{% static 'js/money.js' %}";
</script>

<script>
      function getCSRFToken() {
        const name = "csrftoken=";
        const decodedCookie = decodeURIComponent(document.cookie);
        const cookies = decodedCookie.split(";");

        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.startsWith(name)) {
            return cookie.substring(name.length);
          }
        }
        return null;
      }
      const csrf = getCSRFToken();
      /* =========================================================
       ESTADO GLOBAL (igual comportamiento)
    ========================================================= */
      let productosAutocomplete = [];
      let indiceSeleccionado = -1;
      let activeInput = null;
      let debounceTimer;
      let pagoEditadoManualmente = false;
      let usandoKeypad = false;
      let tipoVentaActual = "MAYORISTA";
      let ventaActualUUID = null;

      let carritos = {{ carritos|safe }};


      /* =========================================================
       REFERENCIAS DOM
    ========================================================= */
      const $ = (id) => document.getElementById(id);

      const inputBuscar = $("buscar");
      const inputCantidad = $("cantidad");
      const sugerencias = $("sugerencias");

      const inputEfectivo = $("efectivo");
      const inputTransferencia = $("transferencia");
      const inputTarjeta = $("tarjeta");
      const inputCliente = $("cliente");
      const inputObservaciones = $("observaciones");


      const btnCerrar = $("btnCerrar");
      const tablaItems = $("tabla_items");

      /* =========================================================
       HELPERS
    ========================================================= */
      const toNumber = (v) => {
        if (v === null || v === undefined || v === "") return 0;
        if (typeof v === "number") return v;

        v = String(v).trim();

        // Si viene del backend como "12000.00"
        if (/^\d+(\.\d+)?$/.test(v)) {
            return parseFloat(v);
        }

        // Si viene formateado como "$12.000"
        return parseFloat(
            v
                .replace(/\$/g, "")
                .replace(/\s/g, "")
                .replace(/\./g, "")
                .replace(",", ".")
        ) || 0;
    };

      const moneyFormatter = new Intl.NumberFormat("es-CO", {
        style: "currency",
        currency: "COP",
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      });

      const money = (v) => {
        return moneyFormatter.format(toNumber(v));
      };

      // VENTA INICIAL (si hay) 
      const ventaInicial = {{ venta|safe }};

      if (ventaInicial){

          ventaActualUUID = ventaInicial.uuid;

      }

function guardarEstadoVenta(){

    if(!ventaActualUUID)
        return Promise.resolve();

    return postJSON("{% url 'sales:pos_guardar' %}",{

        venta_uuid:ventaActualUUID,

        cliente:inputCliente.value,

        observaciones:inputObservaciones.value,

        efectivo:toNumber(inputEfectivo.value),

        transferencia:toNumber(inputTransferencia.value),

        tarjeta:toNumber(inputTarjeta.value)

    });

}

      if(ventaInicial){
        ventaActualUUID = ventaInicial.uuid;
      }
      document.addEventListener("DOMContentLoaded", function(){

          if(ventaInicial){

              actualizarTabla(ventaInicial);

          }

          renderTabs();

      });


      function renderTabs(){

          const cont = document.getElementById("tabsVentas");

          cont.innerHTML = "";

          carritos.forEach((c,index)=>{

              const tab = document.createElement("div");

              tab.className="tab-venta";

              if(c.uuid===ventaActualUUID){

                  tab.classList.add("active");

              }

              const nombre =
                  c.cliente && c.cliente.trim() !== ""
                  ? c.cliente
                  : "Venta "+(index+1);

              tab.innerHTML=`

                  <span>${nombre}</span>

                  <span class="cerrar"
                          onclick="cerrarTab(event,'${c.uuid}')">
                      ×
                  </span>

              `;

              tab.onclick=()=>{

                  if(c.uuid===ventaActualUUID){

                      return;

                  }

                  cargarVenta(c.uuid);

              };

              cont.appendChild(tab);

          });

      }

      function crearNuevaVenta(){

          postJSON("{% url 'sales:pos_nueva_venta' %}")

          .then(res=>{

              if(!res.success){

                  alert(res.error);

                  return;

              }

              const carrito = res.data;

              carritos.unshift({

                  uuid:carrito.uuid,

                  cliente:"",

                  estado:"BORRADOR",

                  total:"0"

              });

              ventaActualUUID = carrito.uuid;

              actualizarTabla(carrito);

              renderTabs();

              inputBuscar.focus();

          });

      }

      function obtenerCarritoUUID(){

          return ventaActualUUID || null;

      }


      function cargarVenta(uuid){

          fetch("{% url 'sales:pos_cargar' %}?uuid="+uuid)

          .then(r=>r.json())

          .then(res=>{

              if(!res.success){

                  alert(res.error);

                  return;

              }

              const venta=res.data;

              ventaActualUUID=venta.uuid;

              actualizarTabla(venta);

              inputCliente.value=venta.cliente;

              inputObservaciones.value=venta.observaciones;

              inputEfectivo.value=venta.efectivo;

              inputTransferencia.value=venta.transferencia;

              inputTarjeta.value=venta.tarjeta;

              setTipoVentaUI(venta.tipo_venta);

              actualizarTotalesPago();

              renderTabs();

              inputBuscar.focus();

          });

      }

      function cerrarTab(e,uuid){

          e.stopPropagation();

          if(!confirm("Cancelar esta venta?")){

              return;

          }

          postJSON("{% url 'sales:pos_cancelar' %}",{

              venta_uuid:uuid

          })

          .then(res=>{

              if(!res.success){

                  alert(res.error);

                  return;

              }

              carritos = res.data;

              if (carritos.length){

                  cargarVenta(carritos[0].uuid);

              }

              renderTabs();

          });

      }



      function confirmarCantidadInput(input) {
        const id = input.dataset.id;
        let nuevaCantidad = parseFloat(input.value);

        if (isNaN(nuevaCantidad) || nuevaCantidad <= 0) {
          nuevaCantidad = 1;
          input.value = 1;
        }

        actualizarCantidad(id, nuevaCantidad);
      }

      /* =========================================================
       DETECTAR INPUT ACTIVO (keypad)
    ========================================================= */
      document.addEventListener("focusin", (e) => {
        if (e.target.tagName === "INPUT") {
          activeInput = e.target;
        }

        if (e.target.classList.contains("cantidad-input")) {
          setTimeout(() => e.target.select(), 0);
        }
      });

      /* =========================================================
       AUTOCOMPLETE
    ========================================================= */
      function renderSugerencias() {
        sugerencias.textContent = "";

        if (!productosAutocomplete.length) {
          indiceSeleccionado = -1;
          sugerencias.style.display = "none";
          return;
        }

        const fragment = document.createDocumentFragment();

        productosAutocomplete.forEach((prod, index) => {
          const item = document.createElement("a");
          item.href = "#";
          item.className =
            "list-group-item list-group-item-action d-flex justify-content-between align-items-center";

          if (prod.sin_stock) {

              item.classList.add(
                  "text-muted"
              );

              item.style.backgroundColor =
                  "#eeeeee";

          }


          if (index === indiceSeleccionado) {
            item.classList.add("active");
          }

          item.scrollIntoView({ block: "nearest" });

          // Evita usar innerHTML (más seguro y más limpio)
          const nombre = document.createElement("strong");
          nombre.textContent = prod.nombre;

          const codigo = document.createElement("small");
          codigo.className = "text-muted";
          codigo.textContent = prod.sku + " | Stock: " + prod.stock;
          if(prod.otras_sucursales.length){

              const infoSucursal =
                  document.createElement("small");

              infoSucursal.className =
                  "text-primary ms-2";


              infoSucursal.textContent =
                  " Otras: " +
                  prod.otras_sucursales
                  .map(
                    x =>
                    x.sucursal +
                    " (" +
                    x.cantidad +
                    ")"
                  )
                  .join(", ");


              item.appendChild(infoSucursal);
          }

          item.appendChild(nombre);
          item.appendChild(codigo);

          item.addEventListener("click", (e) => {
            e.preventDefault();
            seleccionarProducto(prod.id);
          });

          fragment.appendChild(item);
        });

        sugerencias.appendChild(fragment);
        sugerencias.style.display = "block";
      }

      inputBuscar.addEventListener("input", function () {
        clearTimeout(debounceTimer);

        const valor = this.value.trim();

        if (valor.length < 2) {
          productosAutocomplete = [];
          renderSugerencias();
          return;
        }

        debounceTimer = setTimeout(() => {
          fetch("{% url 'sales:pos_autocomplete' %}?q=" + encodeURIComponent(valor))
          .then(res => res.json())
          .then(data => {

              productosAutocomplete = data.results;

              indiceSeleccionado = productosAutocomplete.length ? 0 : -1;

              renderSugerencias();
          })
          .catch(err => {
            console.error("ERROR BUSCANDO PRODUCTOS:", err);
          });
        }, 250);
      });

      /* =========================================================
       TECLADO FÍSICO
    ========================================================= */
      inputBuscar.addEventListener("keydown", function (e) {

        if (e.key === "Enter") {
          e.preventDefault();

          // 🔥 igual que dashboard: usar selección activa
          if (productosAutocomplete.length > 0) {

            const index = indiceSeleccionado >= 0 ? indiceSeleccionado : 0;

            if (productosAutocomplete[index]) {
              seleccionarProducto(productosAutocomplete[index].id);
              return;
            }
          }

          return;
        }

        if (productosAutocomplete.length === 0) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();

          indiceSeleccionado++;
          if (indiceSeleccionado >= productosAutocomplete.length) {
            indiceSeleccionado = 0;
          }

          renderSugerencias();
        }

        if (e.key === "ArrowUp") {
          e.preventDefault();

          indiceSeleccionado--;
          if (indiceSeleccionado < 0) {
            indiceSeleccionado = productosAutocomplete.length - 1;
          }

          renderSugerencias();
        }
      });

      /* =========================================================
       CONFIRMAR CAMBIO EN CANTIDAD (blur + enter físico)
    ========================================================= */

      document.addEventListener(
        "blur",
        function (e) {
          if (!e.target.classList.contains("cantidad-input")) return;
          if (usandoKeypad) return;

          confirmarCantidadInput(e.target);
        },
        true,
      );

      document.addEventListener("keydown", function (e) {
        if (!e.target.classList.contains("cantidad-input")) return;

        if (e.key === "Enter") {
          e.preventDefault();
          confirmarCantidadInput(e.target);
        }
      });

      /* =========================================================
       PETICIONES FETCH CENTRALIZADAS
    ========================================================= */
      function postJSON(url, body) {
        return fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrf,
          },
          body: JSON.stringify(body || {}),
        }).then((res) => res.json());
      }

      /* =========================================================
       AGREGAR PRODUCTO
    ========================================================= */
      function seleccionarProducto(producto_id) {
        const cantidad = parseFloat(inputCantidad.value || "1");

        postJSON("{% url 'sales:pos_agregar' %}", {
            variante_id: producto_id,
            cantidad: cantidad,
            venta_uuid: ventaActualUUID
        }).then(handleTablaResponse);
      }

      function agregarManual() {

        //  SOLO PERMITIR SI HAY AUTOCOMPLETE
        if (productosAutocomplete.length > 0) {
          const index = indiceSeleccionado >= 0 ? indiceSeleccionado : 0;

          if (productosAutocomplete[index]) {
            seleccionarProducto(productosAutocomplete[index].id);
            return;
          }
        }

        // ❌ no permitir texto libre (evita errores backend)
        alert("Selecciona un producto de la lista");
      }

      function handleTablaResponse(response) {
        if (response.success) {
          actualizarTabla(response.data);
          limpiarBusqueda();
        } else {
          alert(response.error);
        }
      }

      function limpiarBusqueda() {
        inputBuscar.value = "";
        inputCantidad.value = "1";

        productosAutocomplete = [];
        indiceSeleccionado = -1;

        sugerencias.innerHTML = "";
        sugerencias.style.display = "none";

        inputBuscar.focus();
      }

      /* =========================================================
        ACTUALIZAR TABLA
    ========================================================= */
      function actualizarTabla(data) {
        tablaItems.innerHTML = "";

        const fragment = document.createDocumentFragment();

        ventaActualUUID = data.uuid;

        inputCliente.value = data.cliente || "";
        inputObservaciones.value = data.observaciones || "";

        inputEfectivo.value = data.efectivo || "";
        inputTransferencia.value = data.transferencia || "";
        inputTarjeta.value = data.tarjeta || "";

        setTipoVentaUI(data.tipo_venta);

        data.items.forEach((item) => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
          <td>${item.nombre || ""}</td>
          <td>
            <input type="text"
              inputmode="numeric"
              value="${item.cantidad}"
              data-id="${item.id}"
              data-current="${toNumber(item.cantidad)}"
              class="form-control form-control-sm cantidad-input">
          </td>
            <td>
              <input type="text"
                value="${toNumber(item.precio_unitario)}"
                data-id="${item.id}"
                class="form-control form-control-sm precio-input">
            </td>
            <td>${money(item.iva_linea)}</td>
            <td>${money(item.subtotal_linea)}</td>
            <td>
            <button onclick="eliminarItem(${item.id})"
              class="btn btn-danger btn-sm">
              X
            </button>
          </td>
        `;

          fragment.appendChild(tr);
        });

        tablaItems.appendChild(fragment);

        $("subtotal").innerText = money(data.subtotal);
        $("iva").innerText = money(data.iva);
        $("total").innerText = money(data.total);
        $("total").dataset.raw = toNumber(data.total);

        actualizarTotalesPago();
      }

      /* =========================================================
        ACTUALIZAR CANTIDAD / ELIMINAR ITEM
    ========================================================= */
      function actualizarCantidad(id, cantidad) {
        if (isNaN(cantidad)) return;

        postJSON("{% url 'sales:pos_actualizar' %}", {
          item_id: id,
          cantidad: cantidad,
          venta_uuid:ventaActualUUID
        }).then((response) => {
          if (response.success) {
            actualizarTabla(response.data);
          } else {
            alert(response.error);
          }
        });
      }

      function eliminarItem(id) {
        postJSON("{% url 'sales:pos_eliminar' %}", {
          item_id: id,
          venta_uuid:ventaActualUUID
        }).then((response) => {
          if (response.success) actualizarTabla(response.data);
          else alert(response.error);
        });
      }

      /* =========================================================
        ACTUALIZAR PAGOS
    ========================================================= */
      [inputEfectivo, inputTransferencia, inputTarjeta].forEach((inp) => {
        inp.addEventListener("input", () => {
          pagoEditadoManualmente = true;
          actualizarTotalesPago();
        });
      });

      // Al abrir un campo con 0.00, se selecciona completo para que escribir
      // un monto lo reemplace sin obligar al cajero a borrarlo primero.
      [inputEfectivo, inputTransferencia].forEach((inp) => {
        inp.addEventListener("focus", () => {
          if (toNumber(inp.value) === 0) {
            setTimeout(() => inp.select(), 0);
          }
        });
      });

      function actualizarTotalesPago() {
      const total = Math.round(toNumber($("total").dataset.raw || 0));

      const efectivo = Math.round(toNumber(inputEfectivo.value));
      const transferencia = Math.round(toNumber(inputTransferencia.value));
      const tarjeta = Math.round(toNumber(inputTarjeta.value));

      const totalPagado = efectivo + transferencia + tarjeta;
      const saldo = totalPagado - total;

      $("total_pagado").innerText = money(totalPagado);

      const infoPago = $("info_pago");

      if (saldo > 0) {
        infoPago.innerText = "Vuelto: " + money(saldo);
        infoPago.className = "fw-bold text-success mb-2";
      } else if (saldo < 0) {
        infoPago.innerText = "Faltante: " + money(Math.abs(saldo));
        infoPago.className = "fw-bold text-danger mb-2";
      } else if (total > 0) {
        infoPago.innerText = "Pago completo";
        infoPago.className = "fw-bold text-primary mb-2";
      } else {
        infoPago.innerText = "";
      }

      btnCerrar.disabled = !(total > 0 && totalPagado >= total);
    }

      /* =========================================================
        CERRAR / CANCELAR VENTA
    ========================================================= */
      function cerrarVenta() {
      postJSON("{% url 'sales:pos_cerrar' %}", {
        venta_uuid:ventaActualUUID,
        efectivo: toNumber(inputEfectivo.value),
        transferencia: toNumber(inputTransferencia.value),
        tarjeta: toNumber(inputTarjeta.value),

        cliente: inputCliente.value,
        observaciones: inputObservaciones.value

      }).then((response) => {
        if (!response.success) {
          alert(response.error);
          return;
        }

        if (response.data.reset) {
          tablaItems.innerHTML = "";

          inputEfectivo.value = "";
          inputTransferencia.value = "";
          inputTarjeta.value = "";

          $("subtotal").innerText = "0.00";
          $("iva").innerText = "0.00";
          $("total").innerText = "0.00";
          $("total").dataset.raw = 0;
          $("total_pagado").innerText = "0.00";
          $("info_pago").innerText = "";

          btnCerrar.disabled = true;
          pagoEditadoManualmente = false;

          setTipoVentaUI("MAYORISTA");

          inputBuscar.focus();
        }
      });
    }

      function cancelarVenta() {
        if (!confirm("¿Cancelar la venta actual?")) return;

        postJSON("{% url 'sales:pos_cancelar' %}").then((response) => {
          if (response.success) location.reload();
          else alert(response.error);
        });
      }

      /* =========================================================
        kEYBOARD NUMÉRICO
    ========================================================= */
      function insertNumber(valor) {
        if (!activeInput) return;

        if (
          activeInput.selectionStart === 0 &&
          activeInput.selectionEnd === activeInput.value.length
        ) {
          activeInput.value = valor;
        } else {
          activeInput.value += valor;
        }

        activeInput.dispatchEvent(new Event("input"));
      }

      function backspaceKey() {
        if (!activeInput) return;
        activeInput.value = activeInput.value.slice(0, -1);
        activeInput.dispatchEvent(new Event("input"));
      }

      function clearActive() {
        if (!activeInput) return;
        activeInput.value = "";
        activeInput.dispatchEvent(new Event("input"));
      }

      function enterKey() {
        if (!activeInput) return;

        if (activeInput === inputBuscar) {
          agregarManual();
          return;
        }

        if (activeInput.classList.contains("cantidad-input")) {
          confirmarCantidadInput(activeInput);
          return;
        }
        activeInput.dispatchEvent(new Event("input"));
      }

      /* =========================================================
       CAMBIAR TIPO VENTA (UI)  - SOLO CAMBIO VISUAL, NO HACE PETICIÓN
    ========================================================= */
      function setTipoVentaUI(tipo) {
        tipoVentaActual = tipo;

        const btnDetal = document.getElementById("btnDetal");
        const btnMayorista = document.getElementById("btnMayorista");

        btnDetal.classList.remove("activo");
        btnMayorista.classList.remove("activo");

        if (tipo === "DETAL") {
          btnDetal.classList.add("activo");
        } else {
          btnMayorista.classList.add("activo");
        }
      }

      /* ================================
       CAMBIAR TIPO VENTA
    ================================ */
      function cambiarTipo(tipo) {
        if (tipo === tipoVentaActual) return;

        postJSON("{% url 'sales:pos_cambiar_tipo' %}", {
          tipo: tipo,
          venta_uuid:ventaActualUUID
        }).then((response) => {
          if (!response.success) {
            alert(response.error);
            return;
          }

          setTipoVentaUI(tipo);
          actualizarTabla(response.data);
        });
      }

      document.addEventListener("blur", function (e) {

      if (!e.target.classList.contains("precio-input")) return;

      const id = e.target.dataset.id;
      const precio = toNumber(e.target.value);

      if (precio <= 0) return;

      postJSON("{% url 'sales:pos_actualizar' %}", {

      item_id:id,

      precio_unitario:precio,

      venta_uuid:ventaActualUUID

    }).then((response) => {
        if (response.success) {
          actualizarTabla(response.data);
        } else {
          alert(response.error);
        }
      });

    }, true);

    let temporizadorGuardadoEstado;

  function programarGuardadoEstado() {
      clearTimeout(temporizadorGuardadoEstado);

      temporizadorGuardadoEstado = setTimeout(() => {
          guardarEstadoVenta();
      }, 400);
  }

  [
      inputCliente,
      inputObservaciones,
      inputEfectivo,
      inputTransferencia,
      inputTarjeta,
  ].forEach((input) => {
      input.addEventListener(
          "input",
          programarGuardadoEstado
      );

      input.addEventListener(
          "change",
          programarGuardadoEstado
      );
  });

  window.addEventListener("pagehide", function () {
      if (ventaActualUUID) {
          guardarEstadoVenta();
      }
  });

</script>

<script src="{% static 'js/money.js' %}"></script>

{% endblock %}

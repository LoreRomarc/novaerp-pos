<h2>Kardex de Inventario</h2>

<table border="1" cellpadding="5">
    <thead>
        <tr>
            <th>Fecha</th>
            <th>Producto</th>
            <th>Tipo</th>
            <th>Cantidad</th>
            <th>Saldo</th>
            <th>Usuario</th>
            <th>Referencia</th>
        </tr>
    </thead>
    <tbody>
        {% for m in movimientos %}
        <tr>
            <td>{{ m.creado }}</td>
            <td>{{ m.variante }}</td>
            <td>{{ m.tipo }}</td>
            <td>{{ m.cantidad }}</td>
            <td>{{ m.saldo_post_movimiento }}</td>
            <td>{{ m.usuario }}</td>
            <td>{{ m.referencia }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="7">No hay movimientos</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

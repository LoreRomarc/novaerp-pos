{% extends "base_erp.html" %}

{% block content %}

<div class="card">
    <h2>Traslados</h2>

    <a href="{% url 'inventory:traslado_create' %}">
        <button>Nuevo traslado</button>
    </a>
</div>

<div class="card">
    <h3>Historial</h3>

    <ul>
        {% for t in traslados %}
            <li>
                #{{ t.id }} - {{ t.origen }} → {{ t.destino }} - {{ t.creado }}
            </li>
        {% endfor %}
    </ul>
</div>

{% endblock %}

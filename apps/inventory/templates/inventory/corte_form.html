<!-- templates/inventory/corte_form.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Corte de Producción</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        table { width: 100%; margin-top: 20px; }
        input, select { padding: 5px; }
        .btn { padding: 10px 20px; background: black; color: white; border: none; }
    </style>
</head>
<body>

<h2>Nuevo Corte</h2>

{% if messages %}
    {% for m in messages %}
        <p>{{ m }}</p>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>Rollo:</label>
    <select name="rollo" required>
        <option value="">Seleccione</option>
        {% for r in rollos %}
            <option value="{{ r.id }}">
                {{ r.codigo }} | {{ r.tipo_tela }} | {{ r.color }} | {{ r.cantidad_disponible }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Tipo:</label>
    <select name="tipo_corte" id="tipo_corte">
        <option value="COMPLETO">Completo</option>
        <option value="PARCIAL">Parcial</option>
    </select>

    <input type="number" step="0.01" name="metros_usados" placeholder="Metros usados">

    <h3>Producción</h3>

    <table id="tabla">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Talla</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="body">
            <tr>
                <td>
                    <select name="producto">
                        {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.nombre }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td><input type="text" name="talla"></td>
                <td><input type="number" name="cantidad"></td>
            </tr>
        </tbody>
    </table>

    <button type="button" onclick="agregarFila()">Agregar</button>

    <br><br>
    <button type="submit" class="btn">Ejecutar Corte</button>
</form>

<script>
function agregarFila() {
    let fila = document.querySelector("#body tr").cloneNode(true)
    document.getElementById("body").appendChild(fila)
}
</script>

</body>
</html>

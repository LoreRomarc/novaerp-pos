<!-- templates/inventory/corte_produccion.html -->
{% extends "base_erp.html" %}

{% block content %}

<div class="card">
    <h2>Proceso de Corte</h2>

    <form method="post">
        {% csrf_token %}

        <label>Rollo</label>
        <select name="rollo" required>
            {% for r in rollos %}
                <option value="{{ r.id }}">
                    {{ r.codigo }} - {{ r.tipo_tela }} - {{ r.color }} ({{ r.cantidad_disponible }})
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>
            <input type="checkbox" name="es_completo">
            Corte completo
        </label>

        <br><br>

        <label>Metros</label>
        <input type="number" step="0.01" name="metros">

        <hr>

        <h3>Producción</h3>

        <div id="items">
            <div class="grid">
                <select name="producto_base">
                    {% for p in productos %}
                        <option value="{{ p.id }}">{{ p.nombre }}</option>
                    {% endfor %}
                </select>

                <input type="text" name="talla" placeholder="Talla">
                <input type="number" name="cantidad" placeholder="Cantidad">
            </div>
        </div>

        <br>

        <button type="button" onclick="addItem()">Agregar línea</button>
        <br><br>

        <button type="submit">Ejecutar Corte</button>
    </form>
</div>

<script>
function addItem() {
    const div = document.createElement("div");

    div.classList.add("grid");

    div.innerHTML = `
        <select name="producto_base">
            {% for p in productos %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
            {% endfor %}
        </select>

        <input type="text" name="talla" placeholder="Talla">
        <input type="number" name="cantidad" placeholder="Cantidad">
    `;

    document.getElementById("items").appendChild(div);
}
</script>

{% endblock %}

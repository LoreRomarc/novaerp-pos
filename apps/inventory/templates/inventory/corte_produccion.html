<!-- templates/inventory/corte_produccion.html -->
{% extends "admin/base_site.html" %}

{% block content %}

<h1>Proceso de Corte y Producción</h1>

<form method="post">
    {% csrf_token %}

    <fieldset>
        <legend>Rollo</legend>

        <label>Seleccionar Rollo:</label>
        <select name="rollo" required>
            {% for r in rollos %}
                <option value="{{ r.id }}">
                    {{ r.codigo }} - {{ r.tipo_tela }} - {{ r.color }} ({{ r.cantidad_disponible }})
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>
            <input type="checkbox" name="es_completo">
            Corte completo
        </label>

        <br><br>

        <label>Metros a usar:</label>
        <input type="number" step="0.01" name="metros">
    </fieldset>

    <hr>

    <fieldset>
        <legend>Producción</legend>

        <div id="items">
            <div>
                <select name="producto_base">
                    {% for p in productos %}
                        <option value="{{ p.id }}">{{ p.nombre }}</option>
                    {% endfor %}
                </select>

                <input type="text" name="talla" placeholder="Talla">

                <input type="number" name="cantidad" placeholder="Cantidad">
            </div>
        </div>

        <button type="button" onclick="addItem()">Agregar línea</button>
    </fieldset>

    <br>

    <button type="submit" class="default">Ejecutar Corte</button>
</form>

<script>
function addItem() {
    const div = document.createElement("div");
    div.innerHTML = `
        <select name="producto_base">
            {% for p in productos %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
            {% endfor %}
        </select>

        <input type="text" name="talla" placeholder="Talla">
        <input type="number" name="cantidad" placeholder="Cantidad">
    `;
    document.getElementById("items").appendChild(div);
}
</script>

{% endblock %}

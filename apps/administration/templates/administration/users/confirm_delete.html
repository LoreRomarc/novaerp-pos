{% extends "base.html" %}

{% block content %}

<div class="card col-md-4 mx-auto mt-5">
    <div class="card-body text-center">
        <h5>¿Eliminar usuario?</h5>

        <p>{{ object.username }}</p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Eliminar</button>
            <a href="{% url 'administration:user_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>

{% endblock %}

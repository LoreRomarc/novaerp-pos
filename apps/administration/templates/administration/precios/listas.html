{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-white d-flex justify-content-between align-items-center">

        <h5>Listas de Precios</h5>

        <a href="{% url 'administration:lista_precio_create' %}"
           class="btn btn-primary">
            ➕ Nueva Lista
        </a>

    </div>

    <div class="card-body">

        <table class="table">

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Sucursal</th>
                    <th>Tipo Venta</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>

                {% for l in listas %}
                <tr>

                    <td>{{ l.nombre }}</td>
                    <td>{{ l.sucursal }}</td>
                    <td>{{ l.get_tipo_venta_display }}</td>

                    <td>
                        {% if l.activa %}
                            <span class="badge bg-success">Activa</span>
                        {% else %}
                            <span class="badge bg-danger">Inactiva</span>
                        {% endif %}
                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header d-flex justify-content-between">

        <h5>Tallas</h5>

        <a href="{% url 'administration:talla_create' %}"
           class="btn btn-primary">
            Nueva talla
        </a>

    </div>

    <div class="card-body">

        <table class="table table-hover">

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Orden</th>
                    <th>Activo</th>
                </tr>
            </thead>

            <tbody>

                {% for talla in tallas %}

                <tr>
                    <td>{{ talla.nombre }}</td>
                    <td>{{ talla.orden }}</td>

                    <td>
                        {% if talla.activo %}
                            ✅
                        {% else %}
                            ❌
                        {% endif %}
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}

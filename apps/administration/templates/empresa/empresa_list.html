{% extends "base.html" %}

{% block content %}

<div class="card p-4">

<h2>🏢 Empresas</h2>

<table class="table">

<thead>
<tr>
    <th>Nombre</th>
    <th>Estado</th>
</tr>
</thead>

<tbody>

{% for empresa in empresas %}

<tr>

<td>
{{ empresa.nombre }}
</td>

<td>

{% if empresa.activa %}
<span class="badge bg-success">
Activa
</span>

{% else %}

<span class="badge bg-danger">
Inactiva
</span>

{% endif %}

</td>

</tr>

{% empty %}

<tr>
<td colspan="2">
No existen empresas
</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}

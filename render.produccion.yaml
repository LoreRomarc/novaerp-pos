# NovaERP - PRODUCCION
# Este Blueprint crea recursos NUEVOS; no apunta a novaerp-pruebas.
# Antes de aplicarlo, cambie `branch` a la rama que publicará como producción.

databases:
  - name: novaerp-db
    plan: free
    databaseName: novaerp
    user: novaerp
    region: oregon

services:
  - type: web
    name: novaerp
    runtime: python
    region: oregon
    # Plan inicial pagado: 0.5 CPU y 512 MB RAM.
    plan: freer{}
    branch: main
    buildCommand: bash build.sh
    # Un proceso evita agotar la memoria del plan inicial de 512 MB.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novaerp-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_USE_WHITENOISE
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      # Activar solamente al usar un dominio propio definitivo.
      - key: DJANGO_HSTS_PRELOAD
        value: "False"
      - key: POSTGRES_CONN_MAX_AGE
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.7"
